name: Build + merge feat a develop

on:
  push:
    branches:
      - 'feat-*'   # cualquier rama feat-... ; cambiar a 'feat/**' si usás barra

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-merge:
    runs-on: ubuntu-latest

    # PostgreSQL de servicio: mismas credenciales/base que application.properties
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: health_plan
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: necesario para que gh pr create resuelva 'develop'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Si este paso falla, el job se corta y NO se mergea nada
      - name: Build con Maven (compila + tests contra PostgreSQL)
        run: mvn -B -ntp clean package

      - name: Crear/reutilizar PR y mergear a develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No existe PR abierto, creando uno nuevo..."
            gh pr create --base develop --head "$GITHUB_REF_NAME" --fill
          else
            echo "Reutilizando PR #$PR ya existente."
          fi
          # Merge directo: solo llegamos acá si el build pasó
          gh pr merge "$GITHUB_REF_NAME" --merge
