# Perfil de producción (se activa con SPRING_PROFILES_ACTIVE=prod).
# A diferencia del default, NO hay valores de respaldo: si falta una variable de
# entorno la app no arranca, evitando correr con credenciales de desarrollo.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El admin inicial lo siembra DataInitializer con ADMIN_USER / ADMIN_PASSWORD.
# Definí ADMIN_PASSWORD en el entorno de prod (no uses el default de desarrollo).

# Menos verboso que en desarrollo.
logging.level.com.sa.healthplan=info
