server.port=${PORT:8081}

# Conexión a la base de datos. Los valores se toman de variables de entorno;
# los defaults son solo para desarrollo local / CI. En producción definir
# DB_URL, DB_USERNAME y DB_PASSWORD por entorno (no versionar credenciales).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/health_plan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# La autenticación usa usuarios de la base de datos (CustomUserDetailsService).
# El admin inicial lo siembra DataInitializer con ADMIN_USER / ADMIN_PASSWORD.

logging.level.com.sa.healthplan=debug

# El esquema lo gestiona Flyway (ver db/migration). Hibernate solo valida que las
# entidades coincidan con las tablas; ya no crea ni modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.open-in-view=false

# Flyway: baseline-on-migrate permite adoptar bases ya existentes (ej. la local
# creada antes con ddl-auto=update) sin reaplicar la migración inicial.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Swagger / OpenAPI: documentar solo los endpoints de la API (no rutas internas).
springdoc.paths-to-match=/api/**
