server.port=8081

# Conexión a la base de datos. Los valores se toman de variables de entorno;
# los defaults son solo para desarrollo local / CI. En producción definir
# DB_URL, DB_USERNAME y DB_PASSWORD por entorno (no versionar credenciales).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/health_plan?zeroDateTimeBehavior=convertToNull}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Usuario básico de autenticación (temporal; en feat-0b se reemplaza por usuarios en BD)
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:1234}

logging.level.com.sa.healthplan=debug

# Crea la tabla con create cuando no creamos las tablas en bd, luego se pone none
# Para la etapa de desarrollo solamente, en produccion poner none y false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.open-in-view=false
